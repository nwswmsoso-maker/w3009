<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>إدارة - دردشة لايف بغداد</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tahoma,Arial,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}

.header{background:#111827;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;border-bottom:1px solid #1e293b;position:sticky;top:0;z-index:100}
.header .logo{font-size:20px;font-weight:bold;color:#fff}
.header .logo span{color:#fbbf24}
.header .logo .admin-tag{background:#ef4444;color:#fff;font-size:11px;padding:2px 8px;border-radius:6px;margin-right:8px}

.login-box{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;z-index:200}
.login-card{background:#1e293b;padding:30px 24px;border-radius:20px;width:360px;max-width:95%}
.login-card h2{text-align:center;color:#fff;margin-bottom:20px}
.login-card label{display:block;font-size:13px;color:#94a3b8;margin-bottom:6px}
.login-card input{width:100%;height:44px;background:#0f172a;border:2px solid #334155;border-radius:12px;color:#fff;padding:0 14px;font-size:14px;font-family:inherit;outline:none;margin-bottom:14px}
.login-card input:focus{border-color:#6366f1}
.login-card .err{color:#ef4444;font-size:13px;text-align:center;margin-bottom:10px;min-height:18px}
.login-card button{width:100%;height:46px;background:#6366f1;color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:bold;cursor:pointer;font-family:inherit}

.hide{display:none!important}

.tabs{display:flex;gap:0;background:#1e293b;border-bottom:1px solid #334155;overflow-x:auto}
.tab{padding:14px 24px;cursor:pointer;color:#94a3b8;font-weight:bold;font-size:14px;border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{color:#fff}
.tab.active{color:#6366f1;border-bottom-color:#6366f1}

.panel{padding:16px;max-width:1200px;margin:0 auto}
.panel.hide{display:none}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.stat{background:#1e293b;padding:16px;border-radius:14px;border:1px solid #334155}
.stat .label{color:#94a3b8;font-size:13px;margin-bottom:6px}
.stat .val{font-size:26px;font-weight:bold;color:#fff}

.search-bar{margin-bottom:14px}
.search-bar input{width:100%;max-width:400px;height:40px;background:#1e293b;border:1px solid #334155;border-radius:10px;color:#fff;padding:0 12px;font-size:14px;font-family:inherit;outline:none}
.search-bar input:focus{border-color:#6366f1}

table{width:100%;border-collapse:collapse;background:#1e293b;border-radius:14px;overflow:hidden}
th,td{padding:12px;text-align:center;font-size:13px;border-bottom:1px solid #334155}
th{background:#111827;color:#94a3b8;font-size:12px}
td{color:#e2e8f0}

.badge{padding:3px 10px;border-radius:999px;font-size:11px;font-weight:bold}
.badge.green{background:#dcfce7;color:#166534}
.badge.red{background:#fee2e2;color:#991b1b}
.badge.yellow{background:#fef3c7;color:#92400e}
.badge.blue{background:#dbeafe;color:#1d4ed8}
.badge.gray{background:#f3f4f6;color:#374151}

.verified{color:#3b82f6;font-size:12px}

.btn{border:none;border-radius:8px;padding:6px 12px;cursor:pointer;font-family:inherit;font-size:12px;font-weight:bold;transition:.2s}
.btn-ban{background:#ef4444;color:#fff}
.btn-unban{background:#10b981;color:#fff}
.btn-mute{background:#f59e0b;color:#fff}
.btn-unmute{background:#06b6d4;color:#fff}
.btn-del{background:#64748b;color:#fff}
.btn:hover{opacity:.85}

.post-card{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:14px;margin-bottom:12px}
.post-card .p-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px}
.post-card .p-user{font-weight:bold;font-size:14px;color:#fff}
.post-card .p-time{font-size:12px;color:#64748b}
.post-card .p-content{font-size:14px;line-height:1.7;margin-bottom:8px;white-space:pre-wrap;word-break:break-word}
.post-card .p-footer{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.post-card .p-stat{font-size:12px;color:#94a3b8}

.comment-row{background:#0f172a;border-radius:10px;padding:10px 12px;margin-bottom:8px}
.comment-row .cr-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;flex-wrap:wrap;gap:6px}
.comment-row .cr-name{font-weight:bold;font-size:13px;color:#fff}
.comment-row .cr-time{font-size:11px;color:#64748b}
.comment-row .cr-text{font-size:13px;color:#cbd5e1}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;opacity:0;transition:.3s;z-index:300;border:1px solid #334155}
.toast.show{opacity:1}

@media(max-width:600px){
  th,td{padding:8px 4px;font-size:11px}
  .btn{padding:4px 8px;font-size:11px}
}
</style>
</head>
<body>

<!-- شاشة دخول الأدمن -->
<div id="loginBox" class="login-box">
  <div class="login-card">
    <h2>دخول الإدارة</h2>
    <label>اسم المستخدم</label>
    <input id="aUser" type="text" placeholder="اسم المستخدم"/>
    <label>كلمة المرور</label>
    <input id="aPass" type="password" placeholder="كلمة المرور"/>
    <div id="aErr" class="err"></div>
    <button id="aBtn" onclick="doLogin()">دخول</button>
  </div>
</div>

<div id="mainApp" class="hide">
  <div class="header">
    <div class="logo">دردشة لايف.<span>بغداد</span> <span class="admin-tag">إدارة</span></div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="dashboard" onclick="switchTab('dashboard')">الرئيسية</div>
    <div class="tab" data-tab="users" onclick="switchTab('users')">المستخدمين</div>
    <div class="tab" data-tab="posts" onclick="switchTab('posts')">المنشورات</div>
    <div class="tab" data-tab="comments" onclick="switchTab('comments')">التعليقات</div>
  </div>

  <!-- الرئيسية -->
  <div id="panel-dashboard" class="panel">
    <div class="stats">
      <div class="stat"><div class="label">المستخدمين</div><div class="val" id="sUsers">0</div></div>
      <div class="stat"><div class="label">المنشورات</div><div class="val" id="sPosts">0</div></div>
      <div class="stat"><div class="label">التعليقات</div><div class="val" id="sComments">0</div></div>
      <div class="stat"><div class="label">الإعجابات</div><div class="val" id="sLikes">0</div></div>
      <div class="stat"><div class="label">محظورين</div><div class="val" id="sBanned">0</div></div>
      <div class="stat"><div class="label">مكتومين</div><div class="val" id="sMuted">0</div></div>
    </div>
  </div>

  <!-- المستخدمين -->
  <div id="panel-users" class="panel hide">
    <div class="search-bar"><input id="userSearch" placeholder="بحث بالاسم..." oninput="renderUsers()"/></div>
    <div style="overflow-x:auto">
      <table><thead><tr>
        <th>الاسم</th><th>اليوزر</th><th>الحالة</th><th>تاريخ التسجيل</th><th>إجراءات</th>
      </tr></thead><tbody id="usersTable"></tbody></table>
    </div>
  </div>

  <!-- المنشورات -->
  <div id="panel-posts" class="panel hide">
    <div id="postsPanel"></div>
  </div>

  <!-- التعليقات -->
  <div id="panel-comments" class="panel hide">
    <div id="commentsPanel"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const supabase=createClient(
'https://ksbnqploabzncftwmyju.supabase.co',
'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtzYm5xcGxvYWJ6bmNmdHdteWp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4NjU2NjcsImV4cCI6MjA5NjQ0MTY2N30.3mWLMIEfuXOLJay7Wi2pYXMcgfZN1fmLXVtooKh_rkc'
);

const $=id=>document.getElementById(id);
let admin=null;
let users=[],posts=[],comments=[],likes=[];

function esc(t){return String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function dateF(d){return d?new Date(d).toLocaleDateString('ar-IQ'):''}
function timeAgo(d){if(!d)return'';const s=Math.floor((Date.now()-new Date(d))/1e3);if(s<60)return'الآن';if(s<3600)return Math.floor(s/60)+' د';if(s<86400)return Math.floor(s/3600)+' س';return Math.floor(s/86400)+' يوم'}
function toast(m){$('toast').textContent=m;$('toast').classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>$('toast').classList.remove('show'),2500)}

// ===== LOGIN =====
window.doLogin=async function(){
  const u=$('aUser').value.trim();
  const p=$('aPass').value.trim();
  if(!u||!p){$('aErr').textContent='أدخل البيانات';return}

  $('aBtn').disabled=true;
  try{
    const{data,error}=await supabase.from('users').select('*').eq('username',u).eq('password',p).eq('is_admin',true).single();
    if(error||!data)throw new Error('بيانات خاطئة أو مو أدمن');
    admin=data;
    $('loginBox').classList.add('hide');
    $('mainApp').classList.remove('hide');
    await loadAll();
    startRealtime();
  }catch(e){$('aErr').textContent=e.message}
  finally{$('aBtn').disabled=false}
}

$('aPass').addEventListener('keydown',e=>{if(e.key==='Enter')window.doLogin()});

// ===== LOAD =====
async function loadAll(){
  const[uR,pR,cR,lR]=await Promise.all([
    supabase.from('users').select('*').order('created_at',{ascending:false}),
    supabase.from('posts').select('*').order('created_at',{ascending:false}),
    supabase.from('comments').select('*').order('created_at',{ascending:false}),
    supabase.from('likes').select('*')
  ]);
  users=uR.data||[];
  posts=pR.data||[];
  comments=cR.data||[];
  likes=lR.data||[];

  updateStats();
  renderUsers();
  renderPosts();
  renderComments();
}

function updateStats(){
  $('sUsers').textContent=users.length;
  $('sPosts').textContent=posts.filter(p=>!p.is_deleted).length;
  $('sComments').textContent=comments.filter(c=>!c.is_deleted).length;
  $('sLikes').textContent=likes.length;
  $('sBanned').textContent=users.filter(u=>u.is_banned).length;
  $('sMuted').textContent=users.filter(u=>u.is_muted).length;
}

// ===== TABS =====
window.switchTab=function(tab){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));
  ['dashboard','users','posts','comments'].forEach(p=>{
    $('panel-'+p).classList.toggle('hide',p!==tab);
  });
}

// ===== USERS =====
function renderUsers(){
  const q=($('userSearch')?.value||'').toLowerCase();
  const filtered=users.filter(u=>{
    if(u.id===admin.id)return false;
    return(u.display_name||'').toLowerCase().includes(q)||(u.username||'').toLowerCase().includes(q);
  });

  $('usersTable').innerHTML=filtered.map(u=>{
    const v=u.is_verified?'<span class="verified">✓</span>':'';
    let status='<span class="badge green">عادي</span>';
    if(u.is_banned)status='<span class="badge red">محظور</span>';
    else if(u.is_muted)status='<span class="badge yellow">مكتوم</span>';

    return`<tr>
      <td>${esc(u.display_name)}${v}</td>
      <td>${esc(u.username)}</td>
      <td>${status}</td>
      <td>${dateF(u.created_at)}</td>
      <td>
        ${u.is_banned
          ?`<button class="btn btn-unban" onclick="toggleBan('${u.id}',false)">فك الحظر</button>`
          :`<button class="btn btn-ban" onclick="toggleBan('${u.id}',true)">حظر</button>`}
        ${u.is_muted
          ?`<button class="btn btn-unmute" onclick="toggleMute('${u.id}',false)">فك الكتم</button>`
          :`<button class="btn btn-mute" onclick="toggleMute('${u.id}',true)">كتم</button>`}
      </td>
    </tr>`;
  }).join('')||'<tr><td colspan="5">ماكو مستخدمين</td></tr>';
}
window.renderUsers=renderUsers;

window.toggleBan=async function(id,ban){
  await supabase.from('users').update({is_banned:ban}).eq('id',id);
  toast(ban?'تم الحظر':'تم فك الحظر');
  await loadAll();
}

window.toggleMute=async function(id,mute){
  await supabase.from('users').update({is_muted:mute}).eq('id',id);
  toast(mute?'تم الكتم':'تم فك الكتم');
  await loadAll();
}

// ===== POSTS =====
function renderPosts(){
  const userMap={};
  users.forEach(u=>userMap[u.id]=u);

  $('postsPanel').innerHTML=posts.filter(p=>!p.is_deleted).map(p=>{
    const u=userMap[p.user_id]||{};
    const v=u.is_verified?'<span class="verified">✓</span>':'';
    const pLikes=likes.filter(l=>l.post_id===p.id).length;
    const pComments=comments.filter(c=>c.post_id===p.id&&!c.is_deleted).length;

    return`
      <div class="post-card">
        <div class="p-head">
          <span class="p-user">${esc(u.display_name||'مجهول')}${v} <span style="color:#64748b;font-weight:normal">@${esc(u.username||'')}</span></span>
          <span class="p-time">${timeAgo(p.created_at)}</span>
        </div>
        <div class="p-content">${esc(p.content)}</div>
        <div class="p-footer">
          <span class="p-stat">❤️ ${pLikes}</span>
          <span class="p-stat">💬 ${pComments}</span>
          <button class="btn btn-del" onclick="delPost('${p.id}')">حذف المنشور</button>
        </div>
      </div>`;
  }).join('')||'<div style="text-align:center;color:#64748b;padding:30px">ماكو منشورات</div>';
}

window.delPost=async function(id){
  if(!confirm('متأكد تحذف هذا المنشور؟'))return;
  await supabase.from('posts').update({is_deleted:true}).eq('id',id);
  toast('تم حذف المنشور');
  await loadAll();
}

// ===== COMMENTS =====
function renderComments(){
  const userMap={};
  users.forEach(u=>userMap[u.id]=u);

  $('commentsPanel').innerHTML=comments.filter(c=>!c.is_deleted).map(c=>{
    const u=userMap[c.user_id]||{};
    const v=u.is_verified?'<span class="verified">✓</span>':'';

    return`
      <div class="comment-row">
        <div class="cr-head">
          <span class="cr-name">${esc(u.display_name||'مجهول')}${v}</span>
          <div style="display:flex;gap:6px;align-items:center">
            <span class="cr-time">${timeAgo(c.created_at)}</span>
            <button class="btn btn-del" onclick="delComment('${c.id}')">حذف</button>
          </div>
        </div>
        <div class="cr-text">${esc(c.content)}</div>
      </div>`;
  }).join('')||'<div style="text-align:center;color:#64748b;padding:30px">ماكو تعليقات</div>';
}

window.delComment=async function(id){
  if(!confirm('متأكد تحذف هذا التعليق؟'))return;
  await supabase.from('comments').update({is_deleted:true}).eq('id',id);
  toast('تم حذف التعليق');
  await loadAll();
}

// ===== REALTIME =====
function startRealtime(){
  supabase.channel('admin-panel')
    .on('postgres_changes',{event:'*',schema:'public',table:'posts'},()=>loadAll())
    .on('postgres_changes',{event:'*',schema:'public',table:'comments'},()=>loadAll())
    .on('postgres_changes',{event:'*',schema:'public',table:'likes'},()=>loadAll())
    .on('postgres_changes',{event:'*',schema:'public',table:'users'},()=>loadAll())
    .subscribe();
}
</script>
</body>
  </html>
