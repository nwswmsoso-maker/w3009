<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#111827"/>
<title>دردشة لايف بغداد</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{overflow-x:hidden;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
body{font-family:'Tajawal',Tahoma,sans-serif;background:#111827;color:#e5e7eb;min-height:100vh;min-height:100dvh;overflow-x:hidden;-webkit-overflow-scrolling:touch}

.header{background:#1f2937;border-bottom:1px solid #374151;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.logo{font-size:20px;font-weight:800;color:#fff;display:flex;align-items:center;gap:8px}
.logo .dot{color:#818cf8}
.logo .city{color:#fbbf24}
.user-area{display:flex;gap:8px;align-items:center}
.live-dot{width:8px;height:8px;background:#4ade80;border-radius:50%;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

.btn{border:none;border-radius:10px;padding:8px 16px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700}
.btn:active{opacity:.7}
.btn-primary{background:#6366f1;color:#fff}
.btn-ghost{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.12)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn:disabled{opacity:.4;pointer-events:none}

.vbadge{display:inline-flex;align-items:center;justify-content:center;background:#3b82f6;color:#fff;border-radius:50%;width:16px;height:16px;font-size:9px;margin-right:3px;vertical-align:middle;flex-shrink:0}
.owner-tag{background:#6366f1;color:#fff;font-size:9px;padding:2px 6px;border-radius:5px;margin-right:3px;font-weight:700;vertical-align:middle}
.status-tag{font-size:9px;padding:2px 6px;border-radius:5px;margin-right:3px;font-weight:700;vertical-align:middle}
.status-tag.banned{background:rgba(239,68,68,.15);color:#fca5a5}
.status-tag.muted{background:rgba(251,191,36,.15);color:#fbbf24}

.auth-overlay{position:fixed;inset:0;background:#111827;display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.auth-box{background:#1f2937;border:1px solid #374151;border-radius:20px;padding:32px 24px;width:380px;max-width:100%}
.auth-box h2{text-align:center;margin-bottom:6px;color:#fff;font-size:22px;font-weight:800}
.auth-box .sub{text-align:center;color:#9ca3af;font-size:13px;margin-bottom:24px}
.auth-box label{display:block;font-size:13px;color:#9ca3af;margin-bottom:5px;font-weight:700}
.auth-box input{width:100%;height:46px;background:#111827;border:2px solid #374151;border-radius:12px;color:#fff;padding:0 14px;font-size:15px;font-family:inherit;outline:none;margin-bottom:14px}
.auth-box input:focus{border-color:#6366f1}
.auth-box .err{color:#ef4444;font-size:13px;text-align:center;margin-bottom:10px;min-height:18px}
.auth-box .switch{text-align:center;margin-top:14px;font-size:14px;color:#9ca3af}
.auth-box .switch a{color:#818cf8;cursor:pointer;font-weight:700}
.hide{display:none!important}

.feed{max-width:600px;margin:16px auto;padding:0 12px;padding-bottom:40px}
.admin-bar{background:rgba(99,102,241,.1);border:1px solid rgba(99,102,241,.25);color:#c4b5fd;padding:10px 14px;border-radius:12px;margin-bottom:14px;font-size:13px;display:flex;align-items:center;gap:8px;font-weight:700}

.avatar-section{background:#1f2937;border:1px solid #374151;border-radius:16px;padding:14px;margin-bottom:16px}
.avatar-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.avatar-row label{cursor:pointer;background:rgba(99,102,241,.15);color:#818cf8;padding:8px 14px;border-radius:10px;font-size:13px;font-weight:700;border:1px solid rgba(99,102,241,.3)}
.avatar-row input[type=file]{display:none}
.avatar-row .hint{font-size:12px;color:#6b7280;flex-basis:100%;margin-top:4px}
.av-big{width:60px;height:60px;font-size:24px}

.compose{background:#1f2937;border:1px solid #374151;border-radius:16px;padding:14px;margin-bottom:16px}
.compose-top{display:flex;gap:10px;align-items:flex-start}
.compose-top textarea{flex:1;min-height:50px;max-height:120px;resize:none;background:transparent;border:none;color:#fff;padding:6px 0;font-size:15px;font-family:inherit;outline:none;line-height:1.6}
.compose-top textarea::placeholder{color:#6b7280}
.compose-bottom{display:flex;justify-content:flex-end;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid #374151}

.post{background:#1f2937;border:1px solid #374151;border-radius:16px;padding:14px;margin-bottom:12px}
.post-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:8px}
.post-user{display:flex;gap:10px;align-items:center;flex:1}

.avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px;flex-shrink:0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.avatar-sm{width:28px;height:28px;font-size:11px}

.name-wrap{display:flex;align-items:center;gap:3px;flex-wrap:wrap}
.post-name{font-weight:800;font-size:14px;color:#fff}
.post-uname{font-size:12px;color:#6b7280}
.post-content{font-size:15px;line-height:1.8;margin-bottom:10px;white-space:pre-wrap;word-break:break-word;color:#e5e7eb}

.post-actions{display:flex;gap:6px;align-items:center;padding-top:10px;border-top:1px solid #374151}
.action-btn{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);color:#9ca3af;cursor:pointer;font-size:13px;font-family:inherit;display:flex;align-items:center;gap:4px;padding:6px 12px;border-radius:10px;font-weight:600}
.action-btn:active{background:rgba(255,255,255,.08)}
.action-btn.liked{color:#ef4444;border-color:rgba(239,68,68,.25);background:rgba(239,68,68,.08)}

.post-menu{position:relative}
.dots{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:#9ca3af;cursor:pointer;font-size:18px;padding:4px 8px;border-radius:8px}
.dropdown{position:absolute;left:0;top:calc(100% + 4px);background:#1f2937;border:1px solid #374151;border-radius:14px;min-width:170px;z-index:50;display:none;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.dropdown.show{display:block}
.dropdown button{width:100%;background:none;border:none;color:#e5e7eb;padding:10px 14px;cursor:pointer;font-family:inherit;font-size:13px;text-align:right;display:flex;align-items:center;gap:6px;font-weight:600}
.dropdown button:active{background:rgba(255,255,255,.06)}
.dropdown button.red{color:#fca5a5}
.dropdown button.yellow{color:#fbbf24}
.dropdown button.green{color:#4ade80}
.dropdown .sep{height:1px;background:#374151;margin:2px 0}

.comments-section{margin-top:12px;padding-top:10px;border-top:1px solid #374151}
.comment{display:flex;gap:8px;margin-bottom:8px;align-items:flex-start}
.comment .c-body{background:#111827;border:1px solid #374151;border-radius:12px;padding:8px 12px;flex:1}
.comment .c-name-wrap{display:flex;align-items:center;gap:3px;flex-wrap:wrap;margin-bottom:2px}
.comment .c-name{font-size:12px;font-weight:700;color:#fff}
.comment .c-text{font-size:13px;color:#d1d5db;line-height:1.5}
.comment .c-time{font-size:10px;color:#6b7280}
.comment .c-del{background:none;border:none;color:#6b7280;cursor:pointer;font-size:11px;margin-right:4px}
.comment .c-del:active{color:#ef4444}
.comment-input{display:flex;gap:6px;margin-top:8px}
.comment-input input{flex:1;height:38px;background:#111827;border:1px solid #374151;border-radius:10px;color:#fff;padding:0 10px;font-size:13px;font-family:inherit;outline:none}
.comment-input input:focus{border-color:#6366f1}
.comment-input button{height:38px;padding:0 14px;background:#6366f1;color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}

.empty-feed{text-align:center;color:#6b7280;padding:40px 16px;font-size:15px}
.muted-msg{background:rgba(251,191,36,.08);color:#fbbf24;padding:12px;border-radius:12px;text-align:center;font-size:14px;margin-bottom:14px;border:1px solid rgba(251,191,36,.2)}
.banned-msg{background:rgba(239,68,68,.08);color:#fca5a5;padding:16px;border-radius:12px;text-align:center;font-size:15px;border:1px solid rgba(239,68,68,.2)}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1f2937;border:1px solid #374151;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;z-index:400;font-weight:600;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    دردشة لايف<span class="dot">.</span><span class="city">بغداد</span>
    <span class="live-dot"></span>
  </div>
  <div class="user-area">
    <span id="headerUser" style="color:#fff;font-weight:700;font-size:14px"></span>
    <button id="logoutBtn" class="btn btn-ghost btn-sm hide">خروج</button>
  </div>
</div>

<div id="authOverlay" class="auth-overlay">
  <div class="auth-box">
    <h2 id="authTitle">تسجيل الدخول</h2>
    <p class="sub">دردشة لايف بغداد</p>
    <div id="nameField" class="hide">
      <label>الاسم الظاهر</label>
      <input id="displayInput" type="text" placeholder="اسمك الظاهر للجميع"/>
    </div>
    <label>اسم المستخدم</label>
    <input id="userInput" type="text" placeholder="اسم المستخدم"/>
    <label>كلمة المرور</label>
    <input id="passInput" type="password" placeholder="كلمة المرور"/>
    <div id="authErr" class="err"></div>
    <button id="authBtn" class="btn btn-primary" style="width:100%;height:48px;font-size:16px;border-radius:14px">دخول</button>
    <div class="switch"><span id="switchText">ما عندك حساب؟</span> <a id="switchLink">إنشاء حساب</a></div>
  </div>
</div>

<div id="mainContent" class="hide">
  <div class="feed">
    <div id="bannedBox" class="banned-msg hide">⛔ تم حظر حسابك</div>
    <div id="mutedBox" class="muted-msg hide">🔇 تم كتمك مؤقتاً</div>
    <div id="adminBar" class="admin-bar hide">🟢 مرحباً صوفي - أنت مالك المنصة</div>

    <!-- رفع الصورة خاص بك فقط -->
    <div id="avatarSection" class="avatar-section hide">
      <div style="color:#9ca3af;font-size:13px;margin-bottom:10px;font-weight:700">تغيير صورتك الشخصية</div>
      <div class="avatar-row">
        <div id="previewAvatar" class="avatar av-big" style="background:#6366f1">?</div>
        <div>
          <label for="avatarFile">📷 اختر صورة أو GIF</label>
          <input type="file" id="avatarFile" accept="image/*,.gif"/>
          <div style="margin-top:6px">
            <button id="saveAvatarBtn" class="btn btn-primary btn-sm hide">حفظ الصورة</button>
          </div>
        </div>
      </div>
      <div class="hint">هذه الميزة متاحة لمالك الموقع فقط</div>
    </div>

    <!-- كتابة المنشور (بدون صور) -->
    <div id="composeBox" class="compose">
      <div class="compose-top">
        <div id="myAvatar" class="avatar" style="background:#6366f1">?</div>
        <textarea id="postInput" placeholder="شنو يدور بخاطرك؟"></textarea>
      </div>
      <div class="compose-bottom">
        <button id="postBtn" class="btn btn-primary">نشر</button>
      </div>
    </div>

    <div id="postsArea"><div class="empty-feed">جاري التحميل...</div></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const supabase = createClient(
  'https://ksbnqploabzncftwmyju.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtzYm5xcGxvYWJ6bmNmdHdteWp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4NjU2NjcsImV4cCI6MjA5NjQ0MTY2N30.3mWLMIEfuXOLJay7Wi2pYXMcgfZN1fmLXVtooKh_rkc'
);

const $ = id => document.getElementById(id);

let me = null;
let isLogin = true;
let selectedAvatarFile = null;
let posts = [];
let usersMap = {};
let commentsMap = {};
let likesMap = {};
let isLoading = false;
let lastPostCount = 0;

function esc(t) { return String(t || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

function timeAgo(d) {
  if (!d) return '';
  const s = Math.floor((Date.now() - new Date(d)) / 1000);
  if (s < 60) return 'الآن';
  if (s < 3600) return Math.floor(s / 60) + ' د';
  if (s < 86400) return Math.floor(s / 3600) + ' س';
  return Math.floor(s / 86400) + ' ي';
}

let toastTimer;
function toast(m) {
  $('toast').textContent = m;
  $('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.remove('show'), 2500);
}

function getInitial(n) { return (n || '?')[0].toUpperCase(); }

function getUserById(id) {
  if (me && id === me.id) return me;
  if (usersMap[id]) return usersMap[id];
  return { id: id, display_name: 'مستخدم', username: '?', avatar_color: '#4b5563', avatar_url: null, is_verified: false, is_admin: false, is_banned: false, is_muted: false };
}

function buildBadges(u, showStatus) {
  let h = '';
  if (u.is_verified) h += '<span class="vbadge">✓</span>';
  if (u.is_admin) h += '<span class="owner-tag">مالك</span>';
  if (showStatus && me && me.is_admin && !u.is_admin) {
    if (u.is_banned) h += '<span class="status-tag banned">محظور</span>';
    else if (u.is_muted) h += '<span class="status-tag muted">مكتوم</span>';
  }
  return h;
}

function buildAvatar(u, extraClass) {
  const cls = 'avatar' + (extraClass ? ' ' + extraClass : '');
  if (u.avatar_url) {
    return '<div class="' + cls + '"><img src="' + esc(u.avatar_url) + '" alt="" loading="lazy"/></div>';
  }
  return '<div class="' + cls + '" style="background:' + esc(u.avatar_color || '#6366f1') + '">' + getInitial(u.display_name) + '</div>';
}

function updateMyAvatarElements() {
  const myAv = $('myAvatar');
  if (myAv) {
    if (me.avatar_url) {
      myAv.style.background = 'none';
      myAv.innerHTML = '<img src="' + esc(me.avatar_url) + '" alt=""/>';
    } else {
      myAv.style.background = me.avatar_color || '#6366f1';
      myAv.innerHTML = getInitial(me.display_name);
    }
  }
  const prev = $('previewAvatar');
  if (prev) {
    if (me.avatar_url) {
      prev.style.background = 'none';
      prev.innerHTML = '<img src="' + esc(me.avatar_url) + '" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%"/>';
    } else {
      prev.style.background = me.avatar_color || '#6366f1';
      prev.innerHTML = getInitial(me.display_name);
    }
  }
}

// ===== AUTH =====
function switchAuthMode() {
  isLogin = !isLogin;
  $('authTitle').textContent = isLogin ? 'تسجيل الدخول' : 'إنشاء حساب';
  $('authBtn').textContent = isLogin ? 'دخول' : 'إنشاء حساب';
  $('switchText').textContent = isLogin ? 'ما عندك حساب؟' : 'عندك حساب؟';
  $('switchLink').textContent = isLogin ? 'إنشاء حساب' : 'تسجيل الدخول';
  $('nameField').classList.toggle('hide', isLogin);
  $('authErr').textContent = '';
}

async function handleAuth() {
  const username = $('userInput').value.trim();
  const password = $('passInput').value.trim();
  const displayName = $('displayInput').value.trim();

  if (!username || !password) { $('authErr').textContent = 'أدخل البيانات'; return; }
  if (!isLogin && !displayName) { $('authErr').textContent = 'أدخل الاسم الظاهر'; return; }

  $('authBtn').disabled = true;
  $('authErr').textContent = '';

  try {
    if (isLogin) {
      const { data, error } = await supabase.from('users').select('*').eq('username', username);
      if (error) throw error;
      if (!data || data.length === 0) throw new Error('اسم المستخدم غير موجود');
      const user = data[0];
      if (user.password !== password) throw new Error('كلمة المرور غلط');
      if (user.is_banned) throw new Error('حسابك محظور');
      me = user;
    } else {
      const { data: existing } = await supabase.from('users').select('id').eq('username', username);
      if (existing && existing.length > 0) throw new Error('اسم المستخدم مستخدم');
      const colors = ['#6366f1','#ec4899','#f59e0b','#10b981','#ef4444','#8b5cf6','#06b6d4','#f97316'];
      const randomColor = colors[Math.floor(Math.random() * colors.length)];
      const { data, error } = await supabase.from('users').insert([{
        username: username, display_name: displayName, password: password, avatar_color: randomColor
      }]).select().single();
      if (error) throw error;
      me = data;
    }

    localStorage.setItem('chat_session', JSON.stringify({ u: me.username, p: me.password }));
    startApp();
  } catch (e) {
    $('authErr').textContent = e.message || 'فشل';
  } finally {
    $('authBtn').disabled = false;
  }
}

function startApp() {
  $('authOverlay').classList.add('hide');
  $('mainContent').classList.remove('hide');
  $('headerUser').innerHTML = esc(me.display_name) + buildBadges(me, false);
  $('logoutBtn').classList.remove('hide');

  if (me.is_banned) {
    $('bannedBox').classList.remove('hide');
    $('composeBox').classList.add('hide');
    return;
  }
  if (me.is_muted) {
    $('mutedBox').classList.remove('hide');
    $('composeBox').classList.add('hide');
  }
  if (me.is_admin) {
    $('adminBar').classList.remove('hide');
    $('avatarSection').classList.remove('hide');
    updateMyAvatarElements();
  } else {
    updateMyAvatarElements();
  }

  loadFeed();
  startRealtime();
  setInterval(() => { if (me && !me.is_banned) loadFeed(true); }, 3000);
}

// ===== AVATAR UPLOAD (ADMIN ONLY) FIX =====
$('avatarFile').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 10 * 1024 * 1024) { toast('الحد 10MB'); return; }

  selectedAvatarFile = file;

  const reader = new FileReader();
  reader.onload = function(ev) {
    const prev = $('previewAvatar');
    if (prev) {
      prev.style.background = 'none';
      prev.innerHTML = '<img src="' + ev.target.result + '" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%"/>';
    }
    $('saveAvatarBtn').classList.remove('hide');
  };
  reader.readAsDataURL(file);
});

$('saveAvatarBtn').addEventListener('click', async function() {
  if (!selectedAvatarFile || !me.is_admin) return;

  const btn = this;
  btn.disabled = true;
  btn.textContent = 'جاري الرفع...';

  try {
    const ext = selectedAvatarFile.name.split('.').pop().toLowerCase();
    // إنشاء اسم فريد في كل مرة و upsert: false لحل مشكلة الـ RLS
    const safeName = 'avatar_' + Date.now() + '_' + Math.floor(Math.random()*1000) + '.' + ext;
    const contentType = selectedAvatarFile.type || 'image/gif';

    const { data: uploaded, error: uploadError } = await supabase.storage
      .from('images')
      .upload(safeName, selectedAvatarFile, {
        contentType: contentType,
        upsert: false 
      });

    if (uploadError) throw new Error('تأكد من فتح صلاحيات الـ SQL للصور');

    const { data: urlData } = supabase.storage.from('images').getPublicUrl(safeName);
    const publicUrl = urlData.publicUrl;

    const { error: dbError } = await supabase.from('users').update({ avatar_url: publicUrl }).eq('id', me.id);
    if (dbError) throw new Error('فشل التحديث');

    me.avatar_url = publicUrl;
    updateMyAvatarElements();
    selectedAvatarFile = null;
    $('saveAvatarBtn').classList.add('hide');
    toast('تم تحديث صورتك ✨');
    await loadFeed();

  } catch (e) {
    toast(e.message || 'فشل');
  } finally {
    btn.disabled = false;
    btn.textContent = 'حفظ الصورة';
  }
});

// ===== FEED =====
async function loadFeed(silent) {
  if (isLoading) return;
  isLoading = true;

  try {
    const [postsRes, usersRes, commentsRes, likesRes] = await Promise.all([
      supabase.from('posts').select('*').eq('is_deleted', false).order('created_at', { ascending: false }).limit(50),
      supabase.from('users').select('*'),
      supabase.from('comments').select('*').eq('is_deleted', false).order('created_at', { ascending: true }),
      supabase.from('likes').select('*')
    ]);

    usersMap = {};
    if (usersRes.data) usersRes.data.forEach(u => { usersMap[u.id] = u; });

    commentsMap = {};
    if (commentsRes.data) {
      commentsRes.data.forEach(c => {
        if (!commentsMap[c.post_id]) commentsMap[c.post_id] = [];
        commentsMap[c.post_id].push(c);
      });
    }

    likesMap = {};
    if (likesRes.data) {
      likesRes.data.forEach(l => {
        if (!likesMap[l.post_id]) likesMap[l.post_id] = [];
        likesMap[l.post_id].push(l);
      });
    }

    const newPosts = postsRes.data || [];

    if (!silent && lastPostCount > 0 && newPosts.length > lastPostCount) {
      if (newPosts[0].user_id !== me.id) toast('📌 منشور جديد');
    }

    posts = newPosts;
    lastPostCount = posts.length;
    renderAllPosts();

  } catch (e) {
    console.error('Load error:', e);
  } finally {
    isLoading = false;
  }
}

function renderAllPosts() {
  const area = $('postsArea');

  if (!posts.length) {
    area.innerHTML = '<div class="empty-feed">🌟 ماكو منشورات بعد</div>';
    return;
  }

  let html = '';

  for (let i = 0; i < posts.length; i++) {
    const post = posts[i];
    const author = getUserById(post.user_id);
    const postComments = commentsMap[post.id] || [];
    const postLikes = likesMap[post.id] || [];
    const isLiked = postLikes.some(l => l.user_id === me.id);
    const canManage = (post.user_id === me.id) || (me && me.is_admin);

    let menuItems = '';
    if (canManage) {
      menuItems += '<button class="red" onclick="window._delPost(\'' + post.id + '\')">🗑 حذف</button>';
    }
    if (me.is_admin && !author.is_admin && post.user_id !== me.id) {
      menuItems += '<div class="sep"></div>';
      menuItems += author.is_banned
        ? '<button class="green" onclick="window._toggleBan(\'' + author.id + '\',false)">✅ فك حظر</button>'
        : '<button class="red" onclick="window._toggleBan(\'' + author.id + '\',true)">🚫 حظر</button>';
      menuItems += author.is_muted
        ? '<button class="green" onclick="window._toggleMute(\'' + author.id + '\',false)">🔊 فك كتم</button>'
        : '<button class="yellow" onclick="window._toggleMute(\'' + author.id + '\',true)">🔇 كتم</button>';
    }

    let menuHtml = menuItems
      ? '<div class="post-menu"><button class="dots" onclick="window._toggleMenu(\'' + post.id + '\')">⋮</button><div class="dropdown" id="menu-' + post.id + '">' + menuItems + '</div></div>'
      : '';

    let commentsHtml = '';
    for (let j = 0; j < postComments.length; j++) {
      const c = postComments[j];
      const cu = getUserById(c.user_id);
      const canDelC = (c.user_id === me.id) || me.is_admin;

      let cAdminBtns = '';
      if (me.is_admin && !cu.is_admin && c.user_id !== me.id) {
        cAdminBtns += cu.is_banned
          ? '<button class="c-del" onclick="window._toggleBan(\'' + cu.id + '\',false)">✅</button>'
          : '<button class="c-del" onclick="window._toggleBan(\'' + cu.id + '\',true)">🚫</button>';
        cAdminBtns += cu.is_muted
          ? '<button class="c-del" onclick="window._toggleMute(\'' + cu.id + '\',false)">🔊</button>'
          : '<button class="c-del" onclick="window._toggleMute(\'' + cu.id + '\',true)">🔇</button>';
      }

      commentsHtml += '<div class="comment">' +
        buildAvatar(cu, 'avatar-sm') +
        '<div class="c-body"><div class="c-name-wrap">' +
        '<span class="c-name">' + esc(cu.display_name) + '</span>' +
        buildBadges(cu, true) +
        '<span class="c-time">' + timeAgo(c.created_at) + '</span>' +
        (canDelC ? '<button class="c-del" onclick="window._delComment(\'' + c.id + '\')">حذف</button>' : '') +
        cAdminBtns +
        '</div><div class="c-text">' + esc(c.content) + '</div></div></div>';
    }

    let commentInputHtml = '';
    if (!me.is_banned && !me.is_muted) {
      commentInputHtml = '<div class="comment-input">' +
        '<input type="text" placeholder="اكتب تعليق..." onkeydown="if(event.key===\'Enter\')window._addComment(\'' + post.id + '\',this.nextElementSibling)"/>' +
        '<button onclick="window._addComment(\'' + post.id + '\',this)">رد</button></div>';
    }

    html += '<div class="post">' +
      '<div class="post-head"><div class="post-user">' +
      buildAvatar(author, '') +
      '<div><div class="name-wrap">' +
      '<span class="post-name">' + esc(author.display_name) + '</span>' +
      buildBadges(author, true) +
      '</div><div class="post-uname">@' + esc(author.username) + ' · ' + timeAgo(post.created_at) + '</div></div></div>' +
      menuHtml + '</div>' +
      '<div class="post-content">' + esc(post.content) + '</div>' +
      '<div class="post-actions">' +
      '<button class="action-btn ' + (isLiked ? 'liked' : '') + '" onclick="window._toggleLike(\'' + post.id + '\')">' + (isLiked ? '❤️' : '🤍') + ' ' + (postLikes.length || '') + '</button>' +
      '<button class="action-btn" onclick="window._toggleComments(\'' + post.id + '\')">💬 ' + (postComments.length || '') + '</button>' +
      '</div>' +
      '<div class="comments-section hide" id="cmts-' + post.id + '">' + commentsHtml + commentInputHtml + '</div>' +
      '</div>';
  }

  area.innerHTML = html;
}

// ===== ACTIONS =====
async function createPost() {
  if (me.is_banned || me.is_muted) return;
  const txt = $('postInput').value.trim();
  if (!txt) { toast('اكتب شي بالمنشور'); return; }

  $('postBtn').disabled = true;

  try {
    const { error } = await supabase.from('posts').insert([{ user_id: me.id, content: txt }]);
    if (error) throw error;
    $('postInput').value = '';
    await loadFeed();
    toast('تم النشر ✨');
  } catch (e) {
    toast(e.message || 'فشل');
  } finally {
    $('postBtn').disabled = false;
  }
}

window._toggleLike = async function(pid) {
  if (me.is_banned) return;
  const existing = (likesMap[pid] || []).find(l => l.user_id === me.id);
  try {
    if (existing) await supabase.from('likes').delete().eq('id', existing.id);
    else await supabase.from('likes').insert([{ post_id: pid, user_id: me.id }]);
    await loadFeed(true);
  } catch (e) { toast(e.message); }
};

window._toggleComments = function(pid) {
  const el = $('cmts-' + pid);
  if (el) el.classList.toggle('hide');
};

window._addComment = async function(pid, btn) {
  if (me.is_banned || me.is_muted) return;
  const input = btn.previousElementSibling;
  const txt = input.value.trim();
  if (!txt) return;
  btn.disabled = true;
  try {
    await supabase.from('comments').insert([{ post_id: pid, user_id: me.id, content: txt }]);
    input.value = '';
    await loadFeed(true);
    setTimeout(() => { const el = $('cmts-' + pid); if (el) el.classList.remove('hide'); }, 200);
  } catch (e) { toast(e.message); }
  finally { btn.disabled = false; }
};

window._delPost = async function(pid) {
  if (!confirm('حذف المنشور؟')) return;
  try {
    await supabase.from('posts').update({ is_deleted: true }).eq('id', pid);
    toast('تم الحذف');
    await loadFeed();
  } catch (e) { toast(e.message); }
};

window._delComment = async function(cid) {
  if (!confirm('حذف التعليق؟')) return;
  try {
    await supabase.from('comments').update({ is_deleted: true }).eq('id', cid);
    toast('تم الحذف');
    await loadFeed(true);
  } catch (e) { toast(e.message); }
};

window._toggleBan = async function(uid, ban) {
  const u = getUserById(uid);
  if (!confirm(ban ? 'حظر ' + u.display_name + '؟' : 'فك حظر ' + u.display_name + '؟')) return;
  try {
    await supabase.from('users').update({ is_banned: ban }).eq('id', uid);
    toast(ban ? 'تم الحظر 🚫' : 'تم فك الحظر ✅');
    await loadFeed();
  } catch (e) { toast(e.message); }
};

window._toggleMute = async function(uid, mute) {
  const u = getUserById(uid);
  if (!confirm(mute ? 'كتم ' + u.display_name + '؟' : 'فك كتم ' + u.display_name + '؟')) return;
  try {
    await supabase.from('users').update({ is_muted: mute }).eq('id', uid);
    toast(mute ? 'تم الكتم 🔇' : 'تم فك الكتم 🔊');
    await loadFeed();
  } catch (e) { toast(e.message); }
};

window._toggleMenu = function(pid) {
  document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('show'));
  const m = $('menu-' + pid);
  if (m) m.classList.toggle('show');
};

document.addEventListener('click', e => {
  if (!e.target.closest('.post-menu')) {
    document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('show'));
  }
});

// ===== REALTIME =====
function startRealtime() {
  supabase.channel('main')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'posts' }, () => loadFeed(true))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'comments' }, () => loadFeed(true))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'likes' }, () => loadFeed(true))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'users' }, () => loadFeed(true))
    .subscribe();
}

// ===== EVENTS =====
$('switchLink').addEventListener('click', switchAuthMode);
$('authBtn').addEventListener('click', handleAuth);
$('logoutBtn').addEventListener('click', () => { localStorage.removeItem('chat_session'); location.reload(); });
$('postBtn').addEventListener('click', createPost);
$('passInput').addEventListener('keydown', e => { if (e.key === 'Enter') handleAuth(); });
$('postInput').addEventListener('keydown', e => { if (e.ctrlKey && e.key === 'Enter') createPost(); });

// ===== INIT =====
(async () => {
  const saved = localStorage.getItem('chat_session');
  if (saved) {
    try {
      const { u, p } = JSON.parse(saved);
      const { data } = await supabase.from('users').select('*').eq('username', u);
      if (data && data.length > 0 && data[0].password === p) {
        me = data[0];
        startApp();
        return;
      }
    } catch (e) {}
    localStorage.removeItem('chat_session');
  }
})();
</script>
