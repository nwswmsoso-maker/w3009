<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#0f0c29"/>
<title>دردشة لايف بغداد</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

html{
  -webkit-text-size-adjust:100%;
  scroll-behavior:smooth;
}

body{
  font-family:'Tajawal',Tahoma,sans-serif;
  background:#0f0c29;
  color:#e2e8f0;
  min-height:100vh;
  overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
}

/* خلفية ثابتة بدون حركة - أفضل للآيفون والأداء */
body::before{
  content:'';
  position:fixed;
  inset:0;
  z-index:-1;
  background:linear-gradient(135deg,#0f0c29 0%,#302b63 50%,#24243e 100%);
}

/* تفعيل تسريع GPU لكل العناصر المتحركة = سلاسة 120Hz */
.btn,.post,.compose,.action-btn,.dots,.dropdown,.toast,.avatar,.comment-input button,.post-img,.vbadge{
  transform:translateZ(0);
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  will-change:transform;
}

.header{
  background:rgba(15,15,35,0.9);
  -webkit-backdrop-filter:blur(20px);
  backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(99,102,241,0.3);
  padding:12px 20px;
  padding-top:max(12px,env(safe-area-inset-top));
  display:flex;justify-content:space-between;align-items:center;
  flex-wrap:wrap;gap:10px;
  position:sticky;top:0;z-index:100;
}
.logo{font-size:24px;font-weight:800;color:#fff;display:flex;align-items:center;gap:8px}
.logo .city{background:linear-gradient(135deg,#fbbf24,#f59e0b);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
.user-area{display:flex;gap:10px;align-items:center}

.btn{
  border:none;border-radius:12px;padding:8px 18px;cursor:pointer;
  font-family:inherit;font-size:13px;font-weight:700;
  transition:transform .18s cubic-bezier(.22,1,.36,1),box-shadow .18s ease;
}
.btn-primary{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;box-shadow:0 4px 15px rgba(99,102,241,0.3)}
.btn-primary:active{transform:scale(.96)}
.btn-ghost{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.15)}
.btn-ghost:active{transform:scale(.96)}
.btn-sm{padding:6px 14px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* صورة متحركة للمالك */
.avatar-animated{
  position:relative;
}
.avatar-animated::after{
  content:'';
  position:absolute;
  inset:-3px;
  border-radius:50%;
  background:linear-gradient(135deg,#6366f1,#ec4899,#fbbf24,#6366f1);
  background-size:300% 300%;
  z-index:-1;
  animation:ringGlow 3s linear infinite;
}
@keyframes ringGlow{
  0%{background-position:0% 50%}
  100%{background-position:300% 50%}
}

.vbadge{display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;border-radius:50%;width:18px;height:18px;font-size:10px;margin-right:4px;vertical-align:middle;flex-shrink:0;box-shadow:0 2px 8px rgba(59,130,246,0.4)}
.owner-tag{background:linear-gradient(135deg,#8b5cf6,#6366f1);color:#fff;font-size:10px;padding:3px 8px;border-radius:8px;margin-right:4px;font-weight:700;vertical-align:middle;box-shadow:0 2px 8px rgba(99,102,241,0.3)}
.status-tag{font-size:10px;padding:2px 7px;border-radius:6px;margin-right:4px;font-weight:700;vertical-align:middle}
.status-tag.banned{background:rgba(239,68,68,0.15);color:#fca5a5;border:1px solid rgba(239,68,68,0.3)}
.status-tag.muted{background:rgba(251,191,36,0.15);color:#fbbf24;border:1px solid rgba(251,191,36,0.3)}

.auth-overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;z-index:200;padding:15px}
.auth-box{background:rgba(30,41,59,0.95);border:1px solid rgba(99,102,241,0.3);border-radius:24px;padding:36px 28px;width:400px;max-width:100%;box-shadow:0 25px 60px rgba(0,0,0,0.5)}
.auth-box h2{text-align:center;margin-bottom:8px;color:#fff;font-size:24px;font-weight:800}
.auth-box .sub{text-align:center;color:#94a3b8;font-size:14px;margin-bottom:28px}
.auth-box label{display:block;font-size:13px;color:#94a3b8;margin-bottom:6px;font-weight:700}
.auth-box input{width:100%;height:48px;background:rgba(15,23,42,0.8);border:2px solid rgba(51,65,85,0.8);border-radius:14px;color:#fff;padding:0 16px;font-size:16px;font-family:inherit;outline:none;margin-bottom:16px;transition:border-color .2s ease}
.auth-box input:focus{border-color:#6366f1}
.auth-box .err{color:#ef4444;font-size:13px;text-align:center;margin-bottom:12px;min-height:18px}
.auth-box .switch{text-align:center;margin-top:16px;font-size:14px;color:#94a3b8}
.auth-box .switch a{color:#818cf8;cursor:pointer;text-decoration:none;font-weight:700}
.hide{display:none!important}

.feed{max-width:640px;margin:24px auto;padding:0 14px;padding-bottom:max(24px,env(safe-area-inset-bottom))}
.admin-bar{background:linear-gradient(135deg,rgba(99,102,241,0.15),rgba(139,92,246,0.15));border:1px solid rgba(99,102,241,0.3);color:#c4b5fd;padding:12px 18px;border-radius:16px;margin-bottom:18px;font-size:13px;display:flex;align-items:center;gap:10px}
.admin-bar .pulse{width:10px;height:10px;background:#4ade80;border-radius:50%;flex-shrink:0;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.85)}}

.compose{background:rgba(30,41,59,0.7);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(51,65,85,0.6);border-radius:20px;padding:18px;margin-bottom:22px;transition:border-color .25s ease,box-shadow .25s ease}
.compose:focus-within{border-color:rgba(99,102,241,0.5);box-shadow:0 0 0 4px rgba(99,102,241,0.1)}
.compose-top{display:flex;gap:12px;align-items:flex-start}
.compose-top textarea{flex:1;min-height:55px;max-height:150px;resize:none;background:transparent;border:none;color:#fff;padding:8px 0;font-size:16px;font-family:inherit;outline:none;line-height:1.7}
.compose-top textarea::placeholder{color:#64748b}
.compose-bottom{display:flex;justify-content:flex-end;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid rgba(51,65,85,0.5)}

.post{background:rgba(30,41,59,0.6);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(51,65,85,0.5);border-radius:20px;padding:18px;margin-bottom:18px;transition:border-color .25s ease,box-shadow .25s ease,transform .25s cubic-bezier(.22,1,.36,1);animation:postIn .4s cubic-bezier(.22,1,.36,1)}
@keyframes postIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.post:hover{border-color:rgba(99,102,241,0.3)}
.post-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:8px}
.post-user{display:flex;gap:12px;align-items:center;flex:1}
.avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px;flex-shrink:0;overflow:hidden;background-size:cover;background-position:center;border:2px solid rgba(255,255,255,0.1)}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.avatar-sm{width:30px;height:30px;font-size:12px;border-width:1px}
.name-wrap{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.post-name{font-weight:800;font-size:15px;color:#fff}
.post-uname{font-size:12px;color:#64748b;font-weight:500}
.post-content{font-size:15px;line-height:1.9;margin-bottom:12px;white-space:pre-wrap;word-break:break-word;color:#e2e8f0}
.post-actions{display:flex;gap:8px;align-items:center;padding-top:12px;border-top:1px solid rgba(51,65,85,0.5)}
.action-btn{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);color:#94a3b8;cursor:pointer;font-size:13px;font-family:inherit;display:flex;align-items:center;gap:5px;padding:7px 14px;border-radius:12px;transition:transform .15s cubic-bezier(.22,1,.36,1),background .2s ease,color .2s ease;font-weight:600}
.action-btn:active{transform:scale(.92)}
.action-btn.liked{color:#ef4444;border-color:rgba(239,68,68,0.3);background:rgba(239,68,68,0.1)}

.post-menu{position:relative}
.dots{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:#94a3b8;cursor:pointer;font-size:18px;padding:6px 10px;border-radius:10px;transition:background .2s ease}
.dots:active{transform:scale(.92)}
.dropdown{position:absolute;left:0;top:calc(100% + 6px);background:rgba(30,41,59,0.98);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid rgba(51,65,85,0.8);border-radius:16px;min-width:180px;z-index:50;display:none;overflow:hidden;box-shadow:0 15px 40px rgba(0,0,0,0.5);transform-origin:top left;animation:dropIn .2s cubic-bezier(.22,1,.36,1)}
@keyframes dropIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.dropdown.show{display:block}
.dropdown button{width:100%;background:none;border:none;color:#e2e8f0;padding:11px 16px;cursor:pointer;font-family:inherit;font-size:13px;text-align:right;display:flex;align-items:center;gap:8px;transition:background .15s ease;font-weight:600}
.dropdown button:active{background:rgba(255,255,255,0.1)}
.dropdown button.red{color:#fca5a5}
.dropdown button.yellow{color:#fbbf24}
.dropdown button.green{color:#4ade80}
.dropdown .sep{height:1px;background:rgba(51,65,85,0.6);margin:2px 0}

.comments-section{margin-top:14px;padding-top:12px;border-top:1px solid rgba(51,65,85,0.5)}
.comment{display:flex;gap:8px;margin-bottom:10px;align-items:flex-start;animation:postIn .3s cubic-bezier(.22,1,.36,1)}
.comment .c-body{background:rgba(15,23,42,0.6);border:1px solid rgba(51,65,85,0.4);border-radius:14px;padding:10px 14px;flex:1}
.comment .c-name-wrap{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-bottom:3px}
.comment .c-name{font-size:13px;font-weight:700;color:#fff}
.comment .c-text{font-size:13px;color:#cbd5e1;line-height:1.6}
.comment .c-time{font-size:11px;color:#64748b;font-weight:500}
.comment .c-del{background:none;border:none;color:#64748b;cursor:pointer;font-size:12px;margin-right:4px;font-weight:600}
.comment .c-del:active{color:#ef4444}
.comment-input{display:flex;gap:8px;margin-top:10px}
.comment-input input{flex:1;height:40px;background:rgba(15,23,42,0.6);border:1px solid rgba(51,65,85,0.5);border-radius:12px;color:#fff;padding:0 12px;font-size:15px;font-family:inherit;outline:none;transition:border-color .2s ease}
.comment-input input:focus{border-color:#6366f1}
.comment-input button{height:40px;padding:0 18px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:none;border-radius:12px;font-size:13px;cursor:pointer;font-family:inherit;font-weight:700;transition:transform .15s ease}
.comment-input button:active{transform:scale(.94)}

.empty-feed{text-align:center;color:#64748b;padding:50px 20px;font-size:16px}
.muted-msg{background:rgba(251,191,36,0.1);color:#fbbf24;padding:14px;border-radius:14px;text-align:center;font-size:14px;margin-bottom:18px;border:1px solid rgba(251,191,36,0.2)}
.banned-msg{background:rgba(239,68,68,0.1);color:#fca5a5;padding:22px;border-radius:14px;text-align:center;font-size:16px;border:1px solid rgba(239,68,68,0.2)}

.toast{position:fixed;bottom:24px;bottom:max(24px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);background:rgba(30,41,59,0.95);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:#fff;padding:14px 22px;border-radius:14px;font-size:14px;opacity:0;transition:opacity .3s ease,transform .3s cubic-bezier(.22,1,.36,1);z-index:400;border:1px solid rgba(99,102,241,0.3);box-shadow:0 10px 30px rgba(0,0,0,0.3);font-weight:600;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* إعدادات المالك - تغيير الصورة */
.profile-edit{margin-top:16px;padding-top:16px;border-top:1px solid rgba(51,65,85,0.5)}
.profile-edit label{display:block;font-size:13px;color:#94a3b8;margin-bottom:8px;font-weight:700}
.avatar-upload-btn{cursor:pointer;background:rgba(99,102,241,0.15);color:#818cf8;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:700;border:1px solid rgba(99,102,241,0.3);display:inline-flex;align-items:center;gap:6px;transition:background .2s ease}
.avatar-upload-btn:active{transform:scale(.96)}
.avatar-upload-btn input{display:none}

@media(max-width:500px){
  .header{padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top))}
  .logo{font-size:20px}
  .feed{padding:0 10px;margin:16px auto}
  .post,.compose{padding:15px}
  .auth-box{padding:24px 18px}
}

/* احترام تفضيل تقليل الحركة */
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .avatar-animated::after{animation:none}
}
</style>
</head>
<body>
<div class="header">
  <div class="logo"><div class="logo-icon">💬</div>دردشة لايف<span style="color:#818cf8">.</span><span class="city">بغداد</span></div>
  <div class="user-area">
    <span id="headerUser" style="color:#fff;font-weight:700;font-size:14px"></span>
    <button id="logoutBtn" class="btn btn-ghost btn-sm hide">خروج</button>
  </div>
</div>

<div id="authOverlay" class="auth-overlay">
  <div class="auth-box">
    <h2 id="authTitle">تسجيل الدخول</h2>
    <p class="sub">دردشة لايف بغداد - تواصل بحرية</p>
    <div id="nameField" class="hide">
      <label>الاسم الظاهر</label>
      <input id="displayInput" type="text" placeholder="اسمك الظاهر للجميع"/>
    </div>
    <label>اسم المستخدم</label>
    <input id="userInput" type="text" placeholder="اسم المستخدم"/>
    <label>كلمة المرور</label>
    <input id="passInput" type="password" placeholder="كلمة المرور"/>
    <div id="authErr" class="err"></div>
    <button id="authBtn" class="btn btn-primary" style="width:100%;height:50px;font-size:16px;border-radius:14px">دخول</button>
    <div class="switch"><span id="switchText">ما عندك حساب؟</span> <a id="switchLink">إنشاء حساب</a></div>
  </div>
</div>

<div id="mainContent" class="hide">
  <div class="feed">
    <div id="bannedBox" class="banned-msg hide">⛔ تم حظر حسابك</div>
    <div id="mutedBox" class="muted-msg hide">🔇 تم كتمك مؤقتاً</div>
    <div id="adminBar" class="admin-bar hide"><span class="pulse"></span>مرحباً صوفي - أنت مالك المنصة</div>

    <div id="composeBox" class="compose">
      <div class="compose-top">
        <div id="myAvatar" class="avatar" style="background:#6366f1">?</div>
        <textarea id="postInput" placeholder="شنو يدور بخاطرك؟ شاركنا..."></textarea>
      </div>
      <div class="compose-bottom">
        <button id="postBtn" class="btn btn-primary">نشر</button>
      </div>

      <!-- إعدادات المالك فقط -->
      <div id="ownerProfileEdit" class="profile-edit hide">
        <label>صورة البروفايل المتحركة (GIF/صورة)</label>
        <label class="avatar-upload-btn">
          🖼️ اختر صورة متحركة
          <input type="file" id="avatarFile" accept="image/*,image/gif"/>
        </label>
      </div>
    </div>

    <div id="postsArea"><div class="empty-feed">جاري التحميل...</div></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const supabase = createClient(
  'https://ksbnqploabzncftwmyju.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtzYm5xcGxvYWJ6bmNmdHdteWp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4NjU2NjcsImV4cCI6MjA5NjQ0MTY2N30.3mWLMIEfuXOLJay7Wi2pYXMcgfZN1fmLXVtooKh_rkc'
);

const $ = id => document.getElementById(id);

let me = null;
let isLogin = true;
let posts = [];
let usersMap = {};
let commentsMap = {};
let likesMap = {};
let refreshTimer = null;

function esc(t){return String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function timeAgo(d){
  if(!d)return'';
  const s=Math.floor((Date.now()-new Date(d))/1000);
  if(s<60)return'الآن';
  if(s<3600)return Math.floor(s/60)+' دقيقة';
  if(s<86400)return Math.floor(s/3600)+' ساعة';
  const days=Math.floor(s/86400);
  if(days<30)return days+' يوم';
  return Math.floor(days/30)+' شهر';
}

function toast(m){
  $('toast').textContent=m;
  $('toast').classList.add('show');
  clearTimeout(toast._t);
  toast._t=setTimeout(()=>$('toast').classList.remove('show'),2800);
}

function initial(n){return(n||'?')[0].toUpperCase()}

function getUser(id){
  if(usersMap[id])return usersMap[id];
  if(me&&id===me.id)return me;
  return{id:id,display_name:'مستخدم',username:'unknown',avatar_color:'#64748b',is_verified:false,is_admin:false,is_banned:false,is_muted:false};
}

function makeBadges(u,showStatus){
  let h='';
  if(u.is_verified)h+='<span class="vbadge" title="حساب موثق">✓</span>';
  if(u.is_admin)h+='<span class="owner-tag">مالك المنصة</span>';
  if(showStatus&&me&&me.is_admin&&!u.is_admin){
    if(u.is_banned)h+='<span class="status-tag banned">محظور</span>';
    else if(u.is_muted)h+='<span class="status-tag muted">مكتوم</span>';
  }
  return h;
}

function makeAvatar(u,extraClass){
  // الصورة المتحركة فقط للمالك
  const animClass=u.is_admin?' avatar-animated':'';
  const cls='avatar'+(extraClass?' '+extraClass:'')+animClass;
  if(u.avatar_url){
    return '<div class="'+cls+'"><img src="'+esc(u.avatar_url)+'"/></div>';
  }
  return '<div class="'+cls+'" style="background:'+esc(u.avatar_color||'#6366f1')+'">'+initial(u.display_name)+'</div>';
}

// ==================== AUTH ====================
function toggleAuth(){
  isLogin=!isLogin;
  $('authTitle').textContent=isLogin?'تسجيل الدخول':'إنشاء حساب جديد';
  $('authBtn').textContent=isLogin?'دخول':'إنشاء حساب';
  $('switchText').textContent=isLogin?'ما عندك حساب؟':'عندك حساب؟';
  $('switchLink').textContent=isLogin?'إنشاء حساب':'تسجيل الدخول';
  $('nameField').classList.toggle('hide',isLogin);
  $('authErr').textContent='';
}

async function doAuth(){
  const user=$('userInput').value.trim();
  const pass=$('passInput').value.trim();
  const display=$('displayInput').value.trim();

  if(!user||!pass){$('authErr').textContent='أدخل اسم المستخدم وكلمة المرور';return}
  if(!isLogin&&!display){$('authErr').textContent='أدخل الاسم الظاهر';return}
  if(!isLogin&&user.length<3){$('authErr').textContent='اسم المستخدم 3 أحرف على الأقل';return}

  $('authBtn').disabled=true;
  $('authErr').textContent='';

  try{
    if(isLogin){
      const{data,error}=await supabase.from('users').select('*').eq('username',user);
      if(error)throw error;
      if(!data||data.length===0)throw new Error('اسم المستخدم غير موجود');
      const found=data[0];
      if(found.password!==pass)throw new Error('كلمة المرور غير صحيحة');
      if(found.is_banned)throw new Error('حسابك محظور من قبل الإدارة');
      me=found;
    }else{
      const{data:existing}=await supabase.from('users').select('id').eq('username',user);
      if(existing&&existing.length>0)throw new Error('اسم المستخدم مستخدم مسبقاً');
      const colors=['#6366f1','#ec4899','#f59e0b','#10b981','#ef4444','#8b5cf6','#06b6d4','#f97316'];
      const color=colors[Math.floor(Math.random()*colors.length)];
      const{data,error}=await supabase.from('users').insert([{username:user,display_name:display,password:pass,avatar_color:color}]).select().single();
      if(error)throw error;
      me=data;
    }
    localStorage.setItem('chat_user',JSON.stringify({username:me.username,password:me.password}));
    showMain();
  }catch(e){
    $('authErr').textContent=e.message||'فشل';
  }finally{
    $('authBtn').disabled=false;
  }
}

function showMain(){
  $('authOverlay').classList.add('hide');
  $('mainContent').classList.remove('hide');
  $('headerUser').innerHTML=esc(me.display_name)+makeBadges(me,false);
  $('logoutBtn').classList.remove('hide');

  updateMyAvatar();

  if(me.is_banned){$('bannedBox').classList.remove('hide');$('composeBox').classList.add('hide');return}
  if(me.is_muted){$('mutedBox').classList.remove('hide');$('composeBox').classList.add('hide')}
  if(me.is_admin){
    $('adminBar').classList.remove('hide');
    $('ownerProfileEdit').classList.remove('hide');
  }

  loadFeed();
  startRealtime();
}

function updateMyAvatar(){
  const el=$('myAvatar');
  el.className='avatar'+(me.is_admin?' avatar-animated':'');
  if(me.avatar_url){
    el.style.background='none';
    el.innerHTML='<img src="'+esc(me.avatar_url)+'"/>';
  }else{
    el.style.background=me.avatar_color||'#6366f1';
    el.innerHTML=initial(me.display_name);
  }
}

// ==================== AVATAR UPLOAD (مالك فقط) ====================
$('avatarFile').addEventListener('change',async function(e){
  const f=e.target.files[0];
  if(!f)return;
  if(f.size>8*1024*1024){toast('الحد الأقصى 8MB');return}

  toast('جاري رفع الصورة...');

  try{
    const ext=f.name.split('.').pop()||'gif';
    const name='avatar_'+me.id+'_'+Date.now()+'.'+ext;
    const{error}=await supabase.storage.from('images').upload(name,f,{contentType:f.type,upsert:true});
    if(error)throw new Error('فشل رفع الصورة - تأكد من Storage');

    const url=supabase.storage.from('images').getPublicUrl(name).data.publicUrl;

    const{error:upErr}=await supabase.from('users').update({avatar_url:url}).eq('id',me.id);
    if(upErr)throw upErr;

    me.avatar_url=url;
    usersMap[me.id]=me;
    updateMyAvatar();
    $('headerUser').innerHTML=esc(me.display_name)+makeBadges(me,false);
    await loadFeed();
    toast('تم تحديث صورتك ✨');
  }catch(err){
    toast(err.message||'فشل');
  }
  e.target.value='';
});

// ==================== FEED ====================
async function loadFeed(){
  try{
    const[pR,uR,cR,lR]=await Promise.all([
      supabase.from('posts').select('*').eq('is_deleted',false).order('created_at',{ascending:false}).limit(50),
      supabase.from('users').select('*'),
      supabase.from('comments').select('*').eq('is_deleted',false).order('created_at',{ascending:true}),
      supabase.from('likes').select('*')
    ]);

    usersMap={};
    if(uR.data)uR.data.forEach(u=>{usersMap[u.id]=u});
    if(me)usersMap[me.id]=me;

    commentsMap={};
    if(cR.data)cR.data.forEach(c=>{if(!commentsMap[c.post_id])commentsMap[c.post_id]=[];commentsMap[c.post_id].push(c)});

    likesMap={};
    if(lR.data)lR.data.forEach(l=>{if(!likesMap[l.post_id])likesMap[l.post_id]=[];likesMap[l.post_id].push(l)});

    posts=pR.data||[];
    renderPosts();
  }catch(e){console.error('Load error:',e)}
}

function renderPosts(){
  const area=$('postsArea');

  if(!posts.length){
    area.innerHTML='<div class="empty-feed">🌟 ماكو منشورات بعد - كون أول واحد ينشر!</div>';
    return;
  }

  const openComments=[];
  document.querySelectorAll('.comments-section:not(.hide)').forEach(el=>openComments.push(el.id));

  let html='';

  for(let i=0;i<posts.length;i++){
    const p=posts[i];
    const u=getUser(p.user_id);
    const cmts=commentsMap[p.id]||[];
    const lks=likesMap[p.id]||[];
    const liked=lks.some(l=>l.user_id===me.id);
    const canManage=(p.user_id===me.id)||me.is_admin;

    let menuItems='';
    if(canManage)menuItems+='<button class="red" onclick="delPost(\''+p.id+'\')">🗑 حذف المنشور</button>';
    if(me.is_admin&&!u.is_admin&&p.user_id!==me.id){
      menuItems+='<div class="sep"></div>';
      menuItems+=u.is_banned?'<button class="green" onclick="toggleBan(\''+u.id+'\',false)">✅ فك حظر '+esc(u.display_name)+'</button>':'<button class="red" onclick="toggleBan(\''+u.id+'\',true)">🚫 حظر '+esc(u.display_name)+'</button>';
      menuItems+=u.is_muted?'<button class="green" onclick="toggleMute(\''+u.id+'\',false)">🔊 فك كتم '+esc(u.display_name)+'</button>':'<button class="yellow" onclick="toggleMute(\''+u.id+'\',true)">🔇 كتم '+esc(u.display_name)+'</button>';
    }

    let menuHtml='';
    if(menuItems)menuHtml='<div class="post-menu"><button class="dots" onclick="toggleMenu(\''+p.id+'\')">⋮</button><div class="dropdown" id="menu-'+p.id+'">'+menuItems+'</div></div>';

    let cmtsHtml='';
    for(let j=0;j<cmts.length;j++){
      const c=cmts[j];
      const cu=getUser(c.user_id);
      const canDelC=(c.user_id===me.id)||me.is_admin;
      let cAdminBtns='';
      if(me.is_admin&&!cu.is_admin&&c.user_id!==me.id){
        cAdminBtns+=cu.is_banned?'<button class="c-del" onclick="toggleBan(\''+cu.id+'\',false)">✅</button>':'<button class="c-del" onclick="toggleBan(\''+cu.id+'\',true)">🚫</button>';
        cAdminBtns+=cu.is_muted?'<button class="c-del" onclick="toggleMute(\''+cu.id+'\',false)">🔊</button>':'<button class="c-del" onclick="toggleMute(\''+cu.id+'\',true)">🔇</button>';
      }
      cmtsHtml+='<div class="comment">'+makeAvatar(cu,'avatar-sm')+'<div class="c-body"><div class="c-name-wrap"><span class="c-name">'+esc(cu.display_name)+'</span>'+makeBadges(cu,true)+'<span class="c-time">'+timeAgo(c.created_at)+'</span>'+(canDelC?'<button class="c-del" onclick="delComment(\''+c.id+'\')">حذف</button>':'')+cAdminBtns+'</div><div class="c-text">'+esc(c.content)+'</div></div></div>';
    }

    let commentInput='';
    if(!me.is_banned&&!me.is_muted){
      commentInput='<div class="comment-input"><input type="text" placeholder="اكتب تعليقك..." onkeydown="if(event.key===\'Enter\')addComment(\''+p.id+'\',this.nextElementSibling)"/><button onclick="addComment(\''+p.id+'\',this)">رد</button></div>';
    }

    const isOpen=openComments.indexOf('cmts-'+p.id)!==-1;

    html+='<div class="post"><div class="post-head"><div class="post-user">'+makeAvatar(u,'')+'<div><div class="name-wrap"><span class="post-name">'+esc(u.display_name)+'</span>'+makeBadges(u,true)+'</div><div class="post-uname">@'+esc(u.username)+' · '+timeAgo(p.created_at)+'</div></div></div>'+menuHtml+'</div><div class="post-content">'+esc(p.content)+'</div><div class="post-actions"><button class="action-btn '+(liked?'liked':'')+'" onclick="toggleLike(\''+p.id+'\')">'+(liked?'❤️':'🤍')+' <span>'+(lks.length||'')+'</span></button><button class="action-btn" onclick="toggleComments(\''+p.id+'\')">💬 <span>'+(cmts.length||'')+'</span></button></div><div class="comments-section '+(isOpen?'':'hide')+'" id="cmts-'+p.id+'">'+cmtsHtml+commentInput+'</div></div>';
  }

  area.innerHTML=html;
}

// ==================== ACTIONS ====================
async function createPost(){
  if(me.is_banned||me.is_muted)return;
  const txt=$('postInput').value.trim();
  if(!txt){toast('اكتب شي أول');return}

  $('postBtn').disabled=true;
  $('postBtn').textContent='جاري...';

  try{
    const{error}=await supabase.from('posts').insert([{user_id:me.id,content:txt}]);
    if(error)throw error;
    $('postInput').value='';
    await loadFeed();
    toast('تم النشر ✨');
  }catch(e){toast(e.message||'فشل')}
  finally{$('postBtn').disabled=false;$('postBtn').textContent='نشر'}
}

window.toggleLike=async function(pid){
  if(me.is_banned)return;
  const lks=likesMap[pid]||[];
  const ex=lks.find(l=>l.user_id===me.id);
  try{
    if(ex)await supabase.from('likes').delete().eq('id',ex.id);
    else await supabase.from('likes').insert([{post_id:pid,user_id:me.id}]);
    await loadFeed();
  }catch(e){toast(e.message)}
};

window.toggleComments=function(pid){$('cmts-'+pid).classList.toggle('hide')};

window.addComment=async function(pid,btn){
  if(me.is_banned||me.is_muted)return;
  const input=btn.previousElementSibling;
  const txt=input.value.trim();
  if(!txt)return;
  btn.disabled=true;
  try{
    const{error}=await supabase.from('comments').insert([{post_id:pid,user_id:me.id,content:txt}]);
    if(error)throw error;
    input.value='';
    await loadFeed();
    setTimeout(()=>{const el=$('cmts-'+pid);if(el)el.classList.remove('hide')},150);
  }catch(e){toast(e.message)}
  finally{btn.disabled=false}
};

window.delPost=async function(pid){
  if(!confirm('متأكد من حذف المنشور؟'))return;
  try{await supabase.from('posts').update({is_deleted:true}).eq('id',pid);toast('تم الحذف');await loadFeed()}catch(e){toast(e.message)}
};

window.delComment=async function(cid){
  if(!confirm('حذف التعليق؟'))return;
  try{await supabase.from('comments').update({is_deleted:true}).eq('id',cid);toast('تم الحذف');await loadFeed()}catch(e){toast(e.message)}
};

window.toggleBan=async function(uid,ban){
  const u=getUser(uid);
  if(!confirm(ban?'حظر '+u.display_name+'؟':'فك حظر '+u.display_name+'؟'))return;
  try{await supabase.from('users').update({is_banned:ban}).eq('id',uid);toast(ban?'تم الحظر 🚫':'تم فك الحظر ✅');await loadFeed()}catch(e){toast(e.message)}
};

window.toggleMute=async function(uid,mute){
  const u=getUser(uid);
  if(!confirm(mute?'كتم '+u.display_name+'؟':'فك كتم '+u.display_name+'؟'))return;
  try{await supabase.from('users').update({is_muted:mute}).eq('id',uid);toast(mute?'تم الكتم 🔇':'تم فك الكتم 🔊');await loadFeed()}catch(e){toast(e.message)}
};

window.toggleMenu=function(pid){
  document.querySelectorAll('.dropdown').forEach(d=>d.classList.remove('show'));
  const m=$('menu-'+pid);
  if(m)m.classList.toggle('show');
};

document.addEventListener('click',function(e){
  if(!e.target.closest('.post-menu'))document.querySelectorAll('.dropdown').forEach(d=>d.classList.remove('show'));
});

// ==================== REALTIME + AUTO REFRESH ====================
function startRealtime(){
  supabase.channel('feed-channel')
    .on('postgres_changes',{event:'*',schema:'public',table:'posts'},()=>loadFeed())
    .on('postgres_changes',{event:'*',schema:'public',table:'comments'},()=>loadFeed())
    .on('postgres_changes',{event:'*',schema:'public',table:'likes'},()=>loadFeed())
    .on('postgres_changes',{event:'*',schema:'public',table:'users'},()=>loadFeed())
    .subscribe();

  if(refreshTimer)clearInterval(refreshTimer);
  refreshTimer=setInterval(function(){
    const a=document.activeElement;
    const typing=a&&(a.tagName==='TEXTAREA'||a.tagName==='INPUT');
    if(!typing)loadFeed();
  },3000);
}

// ==================== EVENTS ====================
$('switchLink').addEventListener('click',toggleAuth);
$('authBtn').addEventListener('click',doAuth);
$('logoutBtn').addEventListener('click',function(){localStorage.removeItem('chat_user');location.reload()});
$('postBtn').addEventListener('click',createPost);
$('passInput').addEventListener('keydown',function(e){if(e.key==='Enter')doAuth()});

// ==================== INIT ====================
async function init(){
  const saved=localStorage.getItem('chat_user');
  if(saved){
    try{
      const parsed=JSON.parse(saved);
      const{data,error}=await supabase.from('users').select('*').eq('username',parsed.username);
      if(!error&&data&&data.length>0&&data[0].password===parsed.password){
        me=data[0];
        showMain();
        return;
      }
    }catch(e){console.error('Init error:',e)}
    localStorage.removeItem('chat_user');
  }
}

init();
</script>
